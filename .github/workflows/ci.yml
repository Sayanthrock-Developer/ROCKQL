name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.80.1
        with:
          components: rustfmt, clippy

      - name: Check formatting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              {
                echo "### rustfmt changes required"
                echo
                echo '```diff'
                git diff -- '*.rs'
                echo '```'
              } > /tmp/rustfmt-comment.md
              gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/rustfmt-comment.md
            fi
            exit 1
          fi

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Build release CLI
        run: cargo build --release --package rockql-cli

      - name: Compile example
        run: ./target/release/rockql compile examples/employees.rockql --target sqlite
