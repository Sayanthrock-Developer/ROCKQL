name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.80.1
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Apply Clippy fixes on draft branch
        run: |
          cargo clippy --fix --workspace --all-targets --all-features --allow-dirty --allow-staged || true
          cargo fmt --all
          if ! git diff --quiet; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add -- '*.rs'
              git commit -m "style: apply Clippy fixes"
              git push origin "HEAD:${{ github.head_ref }}"
            else
              git diff --check
              exit 1
            fi
          fi

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Build release CLI
        run: cargo build --release --package rockql-cli

      - name: Compile example
        run: ./target/release/rockql compile examples/employees.rockql --target sqlite
