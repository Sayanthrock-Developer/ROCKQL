name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.80.1
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Capture Clippy diagnostics
        run: |
          set +e
          cargo clippy --workspace --all-targets --all-features -- -D warnings > clippy-diagnostics.txt 2>&1
          status=$?
          set -e

          if [ "$status" -ne 0 ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add clippy-diagnostics.txt
            git commit -m "ci: capture Clippy diagnostics"
            git push origin "HEAD:${{ github.head_ref }}"
          fi

          cat clippy-diagnostics.txt
          exit "$status"

      - name: Run tests
        run: cargo test --workspace --all-features

      - name: Build release CLI
        run: cargo build --release --package rockql-cli

      - name: Compile example
        run: ./target/release/rockql compile examples/employees.rockql --target sqlite
